<head>

    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 128 128'%3E%3Crect width='128' height='128' rx='28' fill='%2318181b'/%3E%3Cpath transform='translate(30 30) scale(0.1328125)' fill='%23ffffff' d='M220.6 121.2L271.1 96 448 96v96H333.2c-21.9-15.1-48.5-24-77.2-24s-55.2 8.9-77.2 24H64V128H192c9.9 0 19.7-2.3 28.6-6.8zM0 128V416c0 35.3 28.7 64 64 64H448c35.3 0 64-28.7 64-64V96c0-35.3-28.7-64-64-64H271.1c-9.9 0-19.7 2.3-28.6 6.8L192 64H160V48c0-8.8-7.2-16-16-16H80c-8.8 0-16 7.2-16 16l0 16C28.7 64 0 92.7 0 128zM168 304a88 88 0 1 1 176 0 88 88 0 1 1 -176 0z'/%3E%3C/svg%3E">
    <script>
        (function () {
            var path = window.location.pathname;
            var host = window.location.hostname;
            var isGithub = host === "github.io" || host.endsWith(".github.io");
            var repo = "";
            if (isGithub) {
                var firstSeg = path.split("/")[1];
                repo = firstSeg ? ("/" + firstSeg) : "/dihastory";
            }

            var sub = path;
            if (repo && sub.indexOf(repo) === 0) {
                sub = sub.substring(repo.length);
            }
            sub = sub.replace(/^\/+|\/+$/g, "");
            var search = window.location.search || "";
            var hash = window.location.hash || "";

            var cleanBase = repo ? repo : "";
            if (sub && sub !== "index.html") {
                sessionStorage.setItem("spa_clean_path", sub);
                var searchParam = search ? ("&" + search.substring(1)) : "";
                var target = cleanBase + "/?album_path=" + encodeURIComponent(sub) + searchParam + (hash ? hash : "");
                window.location.replace(target);
            } else {
                window.location.replace(cleanBase + "/" + search + hash);
            }
        })();
    </script>
</head>
