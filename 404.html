<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diha Story - Đang chuyển hướng...</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 128 128'%3E%3Crect width='128' height='128' rx='28' fill='%2318181b'/%3E%3Crect x='22' y='38' width='84' height='60' rx='14' fill='%23ffffff'/%3E%3Cpath d='M45 38L51 27C52.5 24.5 55.2 23 58.1 23H69.9C72.8 23 75.5 24.5 77 27L83 38H45Z' fill='%23ffffff'/%3E%3Ccircle cx='64' cy='68' r='19' fill='%2318181b'/%3E%3Ccircle cx='64' cy='68' r='11' fill='%23f43f5e'/%3E%3Ccircle cx='59' cy='63' r='3.5' fill='%23ffffff' opacity='0.9'/%3E%3Ccircle cx='91' cy='51' r='4.5' fill='%2318181b'/%3E%3C/svg%3E">
    <script>
        (function () {
            var path = window.location.pathname;
            var host = window.location.hostname;
            var isGithub = host === "github.io" || host.endsWith(".github.io");
            var repo = "";
            if (isGithub) {
                var firstSeg = path.split("/")[1];
                repo = firstSeg ? ("/" + firstSeg) : "/dihastory";
            }

            var sub = path;
            if (repo && sub.indexOf(repo) === 0) {
                sub = sub.substring(repo.length);
            }
            sub = sub.replace(/^\/+|\/+$/g, "");
            var search = window.location.search || "";
            var hash = window.location.hash || "";

            var cleanBase = repo ? repo : "";
            if (sub && sub !== "index.html") {
                sessionStorage.setItem("spa_clean_path", sub);
                var searchParam = search ? ("&" + search.substring(1)) : "";
                var target = cleanBase + "/?album_path=" + encodeURIComponent(sub) + searchParam + (hash ? hash : "");
                window.location.replace(target);
            } else {
                window.location.replace(cleanBase + "/" + search + hash);
            }
        })();
    </script>
</head>

<body style="font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; background-color: #fafafa; color: #52525b;">
    <div style="text-align: center;">
        <p style="font-size: 15px; font-weight: 600;">Đang tải Album Diha Story...</p>
    </div>
</body>

</html>
