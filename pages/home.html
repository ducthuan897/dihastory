<!-- TRANG 1: TRANG CHỦ (CHIẾU CÁC DỰ ÁN ĐƯỢC KHÁCH CHO PHÉP CÔNG KHAI) -->
<main id="homeView">
    <!-- Studio Portfolio Hero + Quick Client Link Access -->
    <section class="relative bg-zinc-950 text-white py-8 sm:py-12 px-4 overflow-hidden">
        <img id="homeStudioHeroCover" src="https://drive.google.com/thumbnail?id=1okRVSEXUqrh3Pem8XoVFPD7Odv0ONV3U&sz=w1600"
            alt="Studio Hero" class="absolute inset-0 w-full h-full object-cover opacity-25 scale-105 transition-opacity duration-700">
        <div class="absolute inset-0 bg-gradient-to-b from-zinc-950/70 via-zinc-950/80 to-zinc-950"></div>

        <div class="relative z-10 max-w-3xl mx-auto text-center space-y-2.5">
            <h1 class="font-serif-display text-2xl sm:text-4xl font-bold tracking-wide leading-tight">
                Lưu Giữ Khoảnh Khắc Bằng Ánh Sáng &amp; Cảm Xúc
            </h1>

            <p class="text-zinc-300 text-xs sm:text-sm max-w-xl mx-auto">
                Những câu chuyện và khoảnh khắc đáng nhớ được ghi lại qua ống kính của DIHA STORY.
            </p>
        </div>
    </section>

    <!-- Showcase Header -->
    <section class="w-full px-4 sm:px-6 lg:px-10 xl:px-12 pt-5 sm:pt-6 pb-3">
        <div class="flex flex-col sm:flex-row sm:items-end justify-between gap-3 pb-3 border-b border-zinc-200">
            <div>
                <div class="flex items-center gap-2">
                    <span
                        class="bg-emerald-100 text-emerald-800 text-[10px] sm:text-[11px] font-bold px-2.5 py-0.5 rounded-full uppercase tracking-wider">
                        <i class="fa-solid fa-globe mr-1"></i>Bộ Sưu Tập Tiêu Biểu
                    </span>
                    <span id="homePublicAlbumsCount" class="text-xs text-zinc-500 font-semibold">2 Dự Án</span>
                </div>
                <h2 class="font-serif-display text-xl sm:text-3xl font-bold text-zinc-900 mt-1">
                    Các Dự Án Đã Thực Hiện
                </h2>
                <p class="text-xs text-zinc-500">
                    Các bộ ảnh kỷ niệm được sắp xếp tự nhiên theo dấu ấn thời gian của những khoảnh khắc đầu tiên.
                </p>
            </div>

            <!-- Nút Sắp xếp theo thời gian cho Trang Chủ -->
            <div class="flex items-center gap-2 self-start sm:self-end shrink-0">
                <button type="button" onclick="App.toggleHomeTimeSort()"
                    id="homeSortTimeBtn"
                    class="h-9 px-3.5 rounded-xl border border-zinc-200 bg-white hover:bg-zinc-50 hover:border-zinc-300 text-zinc-700 text-xs font-semibold transition flex items-center gap-2 shadow-2xs">
                    <i id="homeSortTimeIcon" class="fa-solid fa-arrow-down-short-wide text-zinc-500"></i>
                    <span id="homeSortTimeLabel">Cũ nhất trước</span>
                </button>
            </div>
        </div>
    </section>

    <!-- Public Projects Showcase Container -->
    <section id="homeShowcaseContainer" class="w-full px-4 sm:px-6 lg:px-10 xl:px-12 pb-6 sm:pb-8">
        <!-- Rendered dynamically by App.js -->
    </section>
</main>
