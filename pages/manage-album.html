<!-- TRANG 4: TRANG SỬA / ĐẶT ẢNH BÌA & QUẢN LÝ CHI TIẾT ALBUM (SHOTPIK PAGE) -->
<main id="albumManageView" class="hidden min-h-screen bg-[#f4f1ea]/70 pb-16">
    <!-- Top Back Notice Bar (Đồng bộ chuẩn thanh màu đen có nút quay lại như Trang Album Khách Hàng) -->
    <div class="bg-zinc-900 text-zinc-200 py-2.5 px-4 border-b border-zinc-800">
        <div class="w-full px-2 sm:px-6 lg:px-8 flex items-center justify-between gap-2 text-xs">
            <button type="button" onclick="App.showView('admin')"
                class="text-zinc-300 hover:text-white font-medium flex items-center gap-1.5 transition">
                <i class="fa-solid fa-arrow-left"></i>
                <span>Quay về trang quản lý</span>
            </button>
            <div class="flex items-center gap-2">
                <span class="text-xs text-zinc-400 hidden sm:inline">Đang quản lý Album</span>
                <span id="managePageBellBadge" class="hidden">0</span>
            </div>
        </div>
    </div>

    <div class="w-full space-y-0">

        <!-- 2. MAIN ALBUM HEADER CARD (BANNER + INFO + TOOLBAR + SUBTABS) -->
        <div class="bg-white space-y-0">

            <!-- Wide Cover Banner — đồng bộ kiểu album-hero -->
            <section class="album-hero" style="min-height:220px;">
                <img id="managePageCoverImg" src="" alt="Album Cover" referrerpolicy="no-referrer"
                    class="album-hero-bg">
                <div class="album-hero-overlay"></div>

                <!-- Nội dung trung tâm -->
                <div class="relative z-10 text-center text-white px-4 max-w-3xl mx-auto py-6 sm:py-8">
                    <h1 id="managePageAlbumTitle"
                        class="font-serif-display text-2xl sm:text-4xl md:text-5xl font-semibold tracking-wide leading-tight mb-1">
                        Tên Album
                    </h1>
                    <p id="managePageClientNameHero"
                        class="text-zinc-300 text-sm sm:text-base font-medium mt-1"></p>
                </div>

                <!-- Top-right "Thay đổi ảnh bìa" pill buttons -->
                <div class="absolute top-4 right-4 flex items-center gap-2 z-20">
                    <label
                        class="hidden sm:inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-black/45 hover:bg-black/65 backdrop-blur-md text-white text-xs font-medium cursor-pointer transition border border-white/25"
                        title="Tải một ảnh từ máy tính lên làm ảnh bìa">
                        <i class="fa-solid fa-upload text-[10px]"></i>
                        <span>Tải ảnh bìa</span>
                        <input type="file" accept="image/*" onchange="AdminModule.handleUploadCoverFile(event)"
                            class="hidden">
                    </label>
                    <button id="managePageChangeCoverBtn" type="button"
                        onclick="AdminModule.toggleCoverSelectMode()"
                        class="px-3.5 py-1.5 rounded-full bg-white/35 hover:bg-white/55 backdrop-blur-md text-white text-xs font-medium transition shadow-xs border border-white/30">
                        Thay đổi ảnh bìa
                    </button>
                </div>
            </section>

            <!-- Info + toolbar wrapper -->
            <div class="px-3 sm:px-6 lg:px-10 xl:px-12 pt-4 pb-0 space-y-4">

            <!-- Cover Selection Active Notice Bar (Appears when clicking "Thay đổi ảnh bìa") -->
            <div id="managePageCoverSelectNotice"
                class="hidden rounded-xl bg-amber-50 border border-amber-300 px-4 py-2.5 flex flex-wrap items-center justify-between gap-2 text-xs text-amber-950">
                <div class="flex items-center gap-2">
                    <i class="fa-solid fa-wand-magic-sparkles text-amber-600"></i>
                    <span><strong>Chế độ chọn ảnh bìa đang bật:</strong> Hãy bấm trực tiếp vào bất kỳ bức ảnh
                        nào ở lưới bên dưới để đặt làm ảnh bìa cho Album!</span>
                </div>
                <button type="button" onclick="AdminModule.toggleCoverSelectMode(false)"
                    class="px-3 py-1 rounded-full bg-amber-200/80 hover:bg-amber-300 text-amber-950 font-semibold transition">
                    Đóng chế độ chọn bìa
                </button>
            </div>

            <!-- Row 2: Client Info, Updated Date, View Status & Tùy chỉnh / Gửi album -->
            <div class="flex flex-wrap items-center justify-between gap-3 pt-0.5">
                <div class="flex flex-wrap items-center gap-x-5 gap-y-1.5 text-xs sm:text-sm text-zinc-500">
                    <span>Khách hàng <strong id="managePageClientName"
                            class="text-zinc-900 font-bold"></strong></span>
                    <span class="inline-flex items-center gap-1 text-zinc-600">
                        <i class="fa-solid fa-location-dot text-rose-500"></i>
                        <span>Địa điểm:</span>
                        <strong id="managePageCityBadge"
                            class="text-zinc-900 font-bold cursor-pointer hover:underline hover:text-rose-600"
                            onclick="AdminModule.quickChangeAlbumLocation()"
                            title="Bấm để đổi nhanh Địa điểm"></strong>
                    </span>
                    <span class="inline-flex items-center gap-1 text-zinc-600">
                        <i class="fa-regular fa-calendar text-emerald-600"></i>
                        <span>Ngày chụp:</span>
                        <strong id="managePageDateBadge"
                            class="text-zinc-900 font-bold cursor-pointer hover:underline hover:text-emerald-700"
                            onclick="AdminModule.quickChangeAlbumDate()"
                            title="Bấm để chỉnh sửa Ngày chụp"></strong>
                    </span>
                    <span id="managePageViewStatusBadge"
                        class="inline-flex items-center gap-1.5 text-emerald-600 font-medium">
                        <i class="fa-regular fa-circle-check"></i>
                        <span>Khách đang xem được</span>
                    </span>
                </div>

                <div class="flex items-center gap-2.5">
                    <button type="button" onclick="AdminModule.openCustomAlbumModal('settings')"
                        class="px-4 py-2 rounded-full bg-white hover:bg-zinc-50 text-zinc-800 border border-zinc-200 shadow-2xs text-xs font-semibold flex items-center gap-2 transition">
                        <i class="fa-solid fa-sliders text-zinc-600"></i>
                        <span>Tùy chỉnh album</span>
                    </button>
                </div>
            </div>

            <!-- Row 3: Interactive Stats Filter Pills & Grouped Action Buttons -->
            <div class="flex flex-wrap items-center justify-between gap-3 pt-1">
                <!-- Left Stats Filter Pills -->
                <div class="flex flex-wrap items-center gap-2">
                    <button id="manageFilterPill_ALL" type="button"
                        onclick="AdminModule.setManageStatFilter('ALL')"
                        class="px-3 py-1.5 rounded-full bg-zinc-900 text-white text-xs font-semibold flex items-center gap-1.5 transition"
                        title="Xem tất cả ảnh trong Album">
                        <i class="fa-regular fa-image"></i>
                        <span id="manageStatTotalCount">0</span>
                    </button>

                    <button id="manageFilterPill_STARRED" type="button"
                        onclick="AdminModule.setManageStatFilter('STARRED')"
                        class="px-2.5 py-1.5 rounded-full bg-zinc-100/80 hover:bg-zinc-200/70 text-zinc-700 text-xs font-semibold flex items-center gap-1 transition"
                        title="Lọc các ảnh đã gắn dấu Sao nổi bật">
                        <i class="fa-solid fa-star text-amber-400"></i>
                        <span id="manageStatStarCount">0</span>
                    </button>

                    <button id="manageFilterPill_SELECTED" type="button"
                        onclick="AdminModule.setManageStatFilter('SELECTED')"
                        class="px-2.5 py-1.5 rounded-full bg-zinc-100/80 hover:bg-zinc-200/70 text-zinc-700 text-xs font-semibold flex items-center gap-1 transition"
                        title="Lọc các ảnh khách đã thả tim chọn">
                        <i class="fa-solid fa-heart text-red-500"></i>
                        <span id="manageStatHeartCount">0</span>
                    </button>

                    <button id="manageFilterPill_NOTED" type="button"
                        onclick="AdminModule.setManageStatFilter('NOTED')"
                        class="px-2.5 py-1.5 rounded-full bg-zinc-100/80 hover:bg-zinc-200/70 text-zinc-700 text-xs font-semibold flex items-center gap-1 transition"
                        title="Lọc các ảnh có ghi chú chỉnh sửa của khách">
                        <i class="fa-regular fa-comment text-blue-600"></i>
                        <span id="manageStatNoteCount">0</span>
                    </button>
                </div>

                <!-- Right Action Pill Groups -->
                <div class="flex flex-wrap items-center gap-2">
                    <!-- Nút Cập nhật album -->
                    <button id="managePageSyncBtn" type="button"
                        onclick="AdminModule.syncUpdateAlbumDrive()"
                        class="px-3.5 py-1.5 rounded-full border border-zinc-200 bg-white hover:bg-zinc-50 text-zinc-800 text-xs font-medium flex items-center gap-1.5 shadow-2xs transition"
                        title="Đồng bộ cập nhật ngay ảnh và vị trí/ngày chụp từ Google Drive">
                        <i id="managePageSyncBtnIcon" class="fa-solid fa-rotate text-zinc-600"></i>
                        <span id="managePageSyncBtnLabel">Cập nhật album</span>
                    </button>

                    <!-- Group 2: Khoá album + Tải PDF ghi chú -->
                    <div
                        class="inline-flex items-center rounded-full border border-zinc-200 bg-white px-1 py-0.5 shadow-2xs">
                        <button id="managePageLockBtn" type="button"
                            onclick="AdminModule.toggleLockAlbumFromManagePage()"
                            class="px-3 py-1.5 rounded-full hover:bg-zinc-100 text-zinc-800 text-xs font-medium flex items-center gap-1.5 transition">
                            <i id="managePageLockIcon" class="fa-solid fa-lock text-zinc-600"></i>
                            <span id="managePageLockBtnText">Khoá album</span>
                        </button>
                        <div class="w-px h-4 bg-zinc-200"></div>
                        <button type="button" onclick="AdminModule.exportFeedbackReport()"
                            class="px-3 py-1.5 rounded-full hover:bg-zinc-100 text-zinc-800 text-xs font-medium flex items-center gap-1.5 transition">
                            <i class="fa-regular fa-file-lines text-zinc-600"></i>
                            <span>Tải PDF ghi chú</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Row 4: Sub-tabs (Tất cả / Địa điểm / Thư mục) & Sort Order -->
            <div class="flex flex-wrap items-center justify-between gap-3 pt-2 border-t border-zinc-100">
                <div id="managePageSubTabs"
                    class="flex items-center gap-5 overflow-x-auto no-scrollbar text-xs sm:text-sm">
                    <!-- Rendered dynamically by AdminModule -->
                </div>

                <div class="flex items-center gap-1.5 text-xs text-zinc-500 pb-1">
                    <span class="text-zinc-400">↓↑</span>
                    <span>Sắp xếp:</span>
                    <select id="managePageSortSelect" onchange="AdminModule.setManageSortOrder(this.value)"
                        class="bg-transparent font-semibold text-zinc-800 outline-none cursor-pointer">
                        <option value="name_asc">Tên hình ảnh từ A -&gt; Z</option>
                        <option value="name_desc">Tên hình ảnh từ Z -&gt; A</option>
                        <option value="time_asc">Thời gian chụp: Cũ -&gt; Mới</option>
                        <option value="time_desc">Thời gian chụp: Mới -&gt; Cũ</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- 3. FULL-WIDTH PHOTO GRID (4 COLUMNS MASONRY / GALLERY LIKE SCREENSHOT) -->
        <div id="managePagePhotosGrid"
            class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3.5">
            <!-- Rendered dynamically by AdminModule -->
        </div>
    </div>
</main>
