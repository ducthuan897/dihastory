<!-- TRANG 4: TRANG SỬA / ĐẶT ẢNH BÌA & QUẢN LÝ CHI TIẾT ALBUM (SHOTPIK PAGE) -->
<main id="albumManageView" class="hidden min-h-screen bg-[#f4f1ea]/70 pb-16">
    <div class="w-full px-3 sm:px-6 lg:px-10 xl:px-12 pt-3 space-y-3.5">

        <!-- 1. TOP FLOATING PILL BAR (SHOTPIK HEADER) -->
        <div
            class="bg-white rounded-2xl px-4 sm:px-6 py-3 shadow-xs border border-zinc-200/80 flex items-center justify-between gap-3">
            <button type="button" onclick="App.showView('admin')"
                class="px-4 py-2 rounded-xl bg-zinc-100 hover:bg-zinc-200 text-zinc-800 text-xs font-semibold flex items-center gap-2 transition">
                <i class="fa-solid fa-arrow-left text-xs"></i>
                <span>Quay về trang quản lý</span>
            </button>
            <div class="flex items-center gap-2">
                <span class="text-xs text-zinc-400 hidden sm:inline">Đang quản lý Album</span>
                <span id="managePageBellBadge" class="hidden">0</span>
            </div>
        </div>

        <!-- 2. MAIN ALBUM HEADER CARD (BANNER + INFO + TOOLBAR + SUBTABS) -->
        <div class="bg-white rounded-[26px] p-4 sm:p-5 shadow-xs border border-zinc-200/80 space-y-4">

            <!-- Wide Cover Banner -->
            <div class="relative h-40 sm:h-48 md:h-52 rounded-2xl overflow-hidden bg-zinc-200 group">
                <img id="managePageCoverImg" src="" alt="Album Cover" referrerpolicy="no-referrer"
                    class="w-full h-full object-cover object-center transition-transform duration-700">
                <div class="absolute inset-0 bg-gradient-to-t from-black/60 via-black/10 to-transparent"></div>

                <!-- Top-right "Thay đổi ảnh bìa" pill button -->
                <div class="absolute top-3.5 right-3.5 flex items-center gap-2 z-10">
                    <label
                        class="hidden sm:inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-black/45 hover:bg-black/65 backdrop-blur-md text-white text-xs font-medium cursor-pointer transition border border-white/25"
                        title="Tải một ảnh từ máy tính lên làm ảnh bìa">
                        <i class="fa-solid fa-upload text-[10px]"></i>
                        <span>Tải ảnh bìa</span>
                        <input type="file" accept="image/*" onchange="AdminModule.handleUploadCoverFile(event)"
                            class="hidden">
                    </label>
                    <button id="managePageChangeCoverBtn" type="button"
                        onclick="AdminModule.toggleCoverSelectMode()"
                        class="px-3.5 py-1.5 rounded-full bg-white/35 hover:bg-white/55 backdrop-blur-md text-white text-xs font-medium transition shadow-xs border border-white/30">
                        Thay đổi ảnh bìa
                    </button>
                </div>

                <!-- Bottom-left Album Title -->
                <h1 id="managePageAlbumTitle"
                    class="absolute bottom-4 left-5 right-5 text-white text-xl sm:text-2xl md:text-[28px] font-bold tracking-tight drop-shadow-sm truncate">
                    Tên Album
                </h1>
            </div>

            <!-- Cover Selection Active Notice Bar (Appears when clicking "Thay đổi ảnh bìa") -->
            <div id="managePageCoverSelectNotice"
                class="hidden rounded-xl bg-amber-50 border border-amber-300 px-4 py-2.5 flex flex-wrap items-center justify-between gap-2 text-xs text-amber-950">
                <div class="flex items-center gap-2">
                    <i class="fa-solid fa-wand-magic-sparkles text-amber-600"></i>
                    <span><strong>Chế độ chọn ảnh bìa đang bật:</strong> Hãy bấm trực tiếp vào bất kỳ bức ảnh
                        nào ở lưới bên dưới để đặt làm ảnh bìa cho Album!</span>
                </div>
                <button type="button" onclick="AdminModule.toggleCoverSelectMode(false)"
                    class="px-3 py-1 rounded-full bg-amber-200/80 hover:bg-amber-300 text-amber-950 font-semibold transition">
                    Đóng chế độ chọn bìa
                </button>
            </div>

            <!-- Row 2: Client Info, Updated Date, View Status & Tùy chỉnh / Gửi album -->
            <div class="flex flex-wrap items-center justify-between gap-3 pt-0.5">
                <div class="flex flex-wrap items-center gap-x-5 gap-y-1.5 text-xs sm:text-sm text-zinc-500">
                    <span>Khách hàng <strong id="managePageClientName"
                            class="text-zinc-900 font-bold"></strong></span>
                    <span class="inline-flex items-center gap-1 text-zinc-600">
                        <i class="fa-solid fa-location-dot text-rose-500"></i>
                        <span>Địa điểm:</span>
                        <strong id="managePageCityBadge"
                            class="text-zinc-900 font-bold cursor-pointer hover:underline hover:text-rose-600"
                            onclick="AdminModule.quickChangeAlbumLocation()"
                            title="Bấm để đổi nhanh Địa điểm"></strong>
                    </span>
                    <span class="inline-flex items-center gap-1 text-zinc-600">
                        <i class="fa-regular fa-calendar text-emerald-600"></i>
                        <span>Ngày chụp:</span>
                        <strong id="managePageDateBadge"
                            class="text-zinc-900 font-bold cursor-pointer hover:underline hover:text-emerald-700"
                            onclick="AdminModule.quickChangeAlbumDate()"
                            title="Bấm để chỉnh sửa Ngày chụp"></strong>
                    </span>
                    <span id="managePageViewStatusBadge"
                        class="inline-flex items-center gap-1.5 text-emerald-600 font-medium">
                        <i class="fa-regular fa-circle-check"></i>
                        <span>Khách đang xem được</span>
                    </span>
                </div>

                <div class="flex items-center gap-2.5">
                    <!-- Nút Mở Album (2 tùy chọn: 1. Trang chỉ xem | 2. Trang chọn ảnh của khách) -->
                    <div class="relative inline-block text-left" id="openAlbumMenuWrap_manage">
                        <button type="button"
                            onclick="event.stopPropagation(); AdminModule.toggleOpenAlbumDropdown('manage')"
                            class="px-4 py-2 rounded-full bg-zinc-900 hover:bg-zinc-800 text-white shadow-xs text-xs font-semibold flex items-center gap-1.5 transition">
                            <i class="fa-solid fa-arrow-up-right-from-square"></i>
                            <span>Mở album</span>
                            <i class="fa-solid fa-chevron-down text-[10px] ml-0.5 opacity-80"></i>
                        </button>
                        <div id="openAlbumDropdown_manage"
                            class="hidden absolute right-0 mt-2 w-64 rounded-2xl bg-white shadow-2xl border border-zinc-200 py-2 z-50 text-xs animate-in fade-in zoom-in-95 duration-100">
                            <button type="button"
                                onclick="App.openAlbumPage(AdminModule.getActiveAdminAlbum()?.id, false); AdminModule.toggleOpenAlbumDropdown('manage', false);"
                                class="w-full text-left px-3.5 py-2.5 hover:bg-zinc-100 flex items-center gap-2.5 text-zinc-800 transition">
                                <div class="w-7 h-7 rounded-lg bg-zinc-100 text-zinc-700 flex items-center justify-center shrink-0">
                                    <i class="fa-regular fa-eye"></i>
                                </div>
                                <div>
                                    <span class="block font-bold text-zinc-900">1. Trang chỉ xem</span>
                                    <span class="text-[10px] text-zinc-500 block">Giao diện xem bộ ảnh công khai như Trang chủ</span>
                                </div>
                            </button>
                            <div class="border-t border-zinc-100 my-1"></div>
                            <button type="button"
                                onclick="App.openAlbumPage(AdminModule.getActiveAdminAlbum()?.id, true); AdminModule.toggleOpenAlbumDropdown('manage', false);"
                                class="w-full text-left px-3.5 py-2.5 hover:bg-rose-50 flex items-center gap-2.5 text-rose-700 transition">
                                <div class="w-7 h-7 rounded-lg bg-rose-100 text-rose-600 flex items-center justify-center shrink-0">
                                    <i class="fa-solid fa-heart"></i>
                                </div>
                                <div>
                                    <span class="block font-bold text-rose-700">2. Trang chọn ảnh của khách</span>
                                    <span class="text-[10px] text-rose-500/80 block">Giao diện link gửi khách thả tim chọn ảnh</span>
                                </div>
                            </button>
                        </div>
                    </div>

                    <button type="button" onclick="AdminModule.openCustomAlbumModal('settings')"
                        class="px-4 py-2 rounded-full bg-white hover:bg-zinc-50 text-zinc-800 border border-zinc-200 shadow-2xs text-xs font-semibold flex items-center gap-2 transition">
                        <i class="fa-solid fa-sliders text-zinc-600"></i>
                        <span>Tùy chỉnh album</span>
                    </button>
                    <button type="button" onclick="AdminModule.sendAlbumAction()"
                        class="px-4 py-2 rounded-full bg-[#b91c1c] hover:bg-red-800 text-white shadow-xs text-xs font-semibold flex items-center gap-2 transition">
                        <i class="fa-regular fa-paper-plane"></i>
                        <span>Gửi album</span>
                    </button>
                </div>
            </div>

            <!-- Row 3: Interactive Stats Filter Pills & Grouped Action Buttons -->
            <div class="flex flex-wrap items-center justify-between gap-3 pt-1">
                <!-- Left Stats Filter Pills -->
                <div class="flex flex-wrap items-center gap-2">
                    <button id="manageFilterPill_ALL" type="button"
                        onclick="AdminModule.setManageStatFilter('ALL')"
                        class="px-3 py-1.5 rounded-full bg-zinc-900 text-white text-xs font-semibold flex items-center gap-1.5 transition"
                        title="Xem tất cả ảnh trong Album">
                        <i class="fa-regular fa-image"></i>
                        <span id="manageStatTotalCount">0</span>
                    </button>

                    <button id="manageFilterPill_STARRED" type="button"
                        onclick="AdminModule.setManageStatFilter('STARRED')"
                        class="px-2.5 py-1.5 rounded-full bg-zinc-100/80 hover:bg-zinc-200/70 text-zinc-700 text-xs font-semibold flex items-center gap-1 transition"
                        title="Lọc các ảnh đã gắn dấu Sao nổi bật">
                        <i class="fa-solid fa-star text-amber-400"></i>
                        <span id="manageStatStarCount">0</span>
                    </button>

                    <button id="manageFilterPill_SELECTED" type="button"
                        onclick="AdminModule.setManageStatFilter('SELECTED')"
                        class="px-2.5 py-1.5 rounded-full bg-zinc-100/80 hover:bg-zinc-200/70 text-zinc-700 text-xs font-semibold flex items-center gap-1 transition"
                        title="Lọc các ảnh khách đã thả tim chọn">
                        <i class="fa-solid fa-heart text-red-500"></i>
                        <span id="manageStatHeartCount">0</span>
                    </button>

                    <button id="manageFilterPill_NOTED" type="button"
                        onclick="AdminModule.setManageStatFilter('NOTED')"
                        class="px-2.5 py-1.5 rounded-full bg-zinc-100/80 hover:bg-zinc-200/70 text-zinc-700 text-xs font-semibold flex items-center gap-1 transition"
                        title="Lọc các ảnh có ghi chú chỉnh sửa của khách">
                        <i class="fa-regular fa-comment text-blue-600"></i>
                        <span id="manageStatNoteCount">0</span>
                    </button>
                </div>

                <!-- Right Action Pill Groups -->
                <div class="flex flex-wrap items-center gap-2">
                    <!-- Group 1: Cập nhật album + Tìm khuôn mặt -->
                    <div
                        class="inline-flex items-center rounded-full border border-zinc-200 bg-white px-1 py-0.5 shadow-2xs">
                        <button id="managePageSyncBtn" type="button"
                            onclick="AdminModule.syncUpdateAlbumDrive()"
                            class="px-3 py-1.5 rounded-full hover:bg-zinc-100 text-zinc-800 text-xs font-medium flex items-center gap-1.5 transition"
                            title="Đồng bộ cập nhật ngay ảnh và vị trí/ngày chụp từ Google Drive">
                            <i id="managePageSyncBtnIcon" class="fa-solid fa-rotate text-zinc-600"></i>
                            <span id="managePageSyncBtnLabel">Cập nhật album</span>
                        </button>
                        <div class="w-px h-4 bg-zinc-200"></div>
                        <div class="relative">
                            <button type="button" onclick="AdminModule.toggleFaceFilterDropdown()"
                                class="px-3 py-1.5 rounded-full hover:bg-zinc-100 text-zinc-800 text-xs font-medium flex items-center gap-1.5 transition">
                                <i class="fa-solid fa-expand text-zinc-600"></i>
                                <span id="manageFaceFilterLabel">Tìm khuôn mặt</span>
                                <i class="fa-solid fa-chevron-down text-[10px] text-zinc-400"></i>
                            </button>
                            <!-- Dropdown lọc người chọn / tìm theo ảnh chân dung -->
                            <div id="manageFaceFilterDropdown"
                                class="hidden absolute right-0 mt-2 w-60 rounded-2xl bg-white shadow-xl border border-zinc-200 p-2 z-30 space-y-1 text-xs">
                                <div class="px-2.5 py-1 text-[11px] font-bold text-zinc-400 uppercase">Lọc theo
                                    người chọn / Khuôn mặt</div>
                                <div id="manageFaceFilterList" class="space-y-1"></div>
                                <div class="border-t border-zinc-100 pt-1.5 mt-1">
                                    <label
                                        class="flex items-center gap-2 px-2.5 py-1.5 rounded-xl hover:bg-zinc-100 cursor-pointer text-zinc-700 font-medium">
                                        <i class="fa-solid fa-camera text-rose-500"></i>
                                        <span>Tải ảnh mẫu để lọc nhanh</span>
                                        <input type="file" accept="image/*"
                                            onchange="AdminModule.handleFaceSampleSearch(event)" class="hidden">
                                    </label>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Group 2: Khoá album + Tải PDF ghi chú -->
                    <div
                        class="inline-flex items-center rounded-full border border-zinc-200 bg-white px-1 py-0.5 shadow-2xs">
                        <button id="managePageLockBtn" type="button"
                            onclick="AdminModule.toggleLockAlbumFromManagePage()"
                            class="px-3 py-1.5 rounded-full hover:bg-zinc-100 text-zinc-800 text-xs font-medium flex items-center gap-1.5 transition">
                            <i id="managePageLockIcon" class="fa-solid fa-lock text-zinc-600"></i>
                            <span id="managePageLockBtnText">Khoá album</span>
                        </button>
                        <div class="w-px h-4 bg-zinc-200"></div>
                        <button type="button" onclick="AdminModule.exportFeedbackReport()"
                            class="px-3 py-1.5 rounded-full hover:bg-zinc-100 text-zinc-800 text-xs font-medium flex items-center gap-1.5 transition">
                            <i class="fa-regular fa-file-lines text-zinc-600"></i>
                            <span>Tải PDF ghi chú</span>
                        </button>
                    </div>

                    <!-- Group 3: Các tính năng khác -->
                    <div class="relative">
                        <button type="button" onclick="AdminModule.toggleMoreFeaturesDropdown()"
                            class="px-3.5 py-2 rounded-full border border-zinc-200 bg-white hover:bg-zinc-50 text-zinc-800 text-xs font-medium flex items-center gap-1.5 shadow-2xs transition">
                            <i class="fa-solid fa-ellipsis"></i>
                            <span>Các tính năng khác</span>
                        </button>
                        <div id="manageMoreFeaturesDropdown"
                            class="hidden absolute right-0 mt-2 w-64 rounded-2xl bg-white shadow-xl border border-zinc-200 p-2 z-30 space-y-1 text-xs">
                            <button type="button"
                                onclick="AdminModule.openCustomAlbumModal('selections'); AdminModule.toggleMoreFeaturesDropdown(false);"
                                class="w-full text-left px-3 py-2 rounded-xl hover:bg-zinc-100 flex items-center gap-2.5 text-zinc-700 font-medium">
                                <i class="fa-solid fa-filter text-amber-500 w-4"></i>
                                <span>Chuỗi lọc file Lightroom / Capture One</span>
                            </button>
                            <button type="button"
                                onclick="AdminModule.openCustomAlbumModal('delivered'); AdminModule.toggleMoreFeaturesDropdown(false);"
                                class="w-full text-left px-3 py-2 rounded-xl hover:bg-zinc-100 flex items-center gap-2.5 text-zinc-700 font-medium">
                                <i class="fa-solid fa-wand-magic-sparkles text-emerald-600 w-4"></i>
                                <span>Bàn giao Ảnh đã chỉnh (Before/After)</span>
                            </button>
                            <label
                                class="w-full text-left px-3 py-2 rounded-xl hover:bg-zinc-100 flex items-center gap-2.5 text-zinc-700 font-medium cursor-pointer">
                                <i class="fa-solid fa-cloud-arrow-up text-sky-600 w-4"></i>
                                <span>Tải thêm ảnh từ máy tính</span>
                                <input type="file" accept="image/*" multiple
                                    onchange="AdminModule.handleLocalFilesUpload(event); AdminModule.toggleMoreFeaturesDropdown(false);"
                                    class="hidden">
                            </label>
                            <button type="button"
                                onclick="AdminModule.clearClientSelections(); AdminModule.toggleMoreFeaturesDropdown(false);"
                                class="w-full text-left px-3 py-2 rounded-xl hover:bg-rose-50 flex items-center gap-2.5 text-rose-600 font-medium">
                                <i class="fa-solid fa-eraser w-4"></i>
                                <span>Gỡ tương tác (Khách chọn lại)</span>
                            </button>
                            <button type="button"
                                onclick="AdminModule.restoreRemovedInteractions(); AdminModule.toggleMoreFeaturesDropdown(false);"
                                class="w-full text-left px-3 py-2 rounded-xl hover:bg-emerald-50 flex items-center gap-2.5 text-emerald-700 font-medium">
                                <i class="fa-solid fa-clock-rotate-left w-4"></i>
                                <span>Khôi phục tương tác đã gỡ</span>
                            </button>
                            <div class="border-t border-zinc-100 my-1"></div>
                            <div class="px-3 py-1 text-[10px] uppercase font-bold text-zinc-400 tracking-wider">Mở Album</div>
                            <button type="button"
                                onclick="App.openAlbumPage(AdminModule.getActiveAdminAlbum()?.id, false); AdminModule.toggleMoreFeaturesDropdown(false);"
                                class="w-full text-left px-3 py-2 rounded-xl hover:bg-zinc-100 flex items-center gap-2.5 text-zinc-700 font-medium">
                                <i class="fa-regular fa-eye text-zinc-500 w-4"></i>
                                <span>1. Trang chỉ xem</span>
                            </button>
                            <button type="button"
                                onclick="App.openAlbumPage(AdminModule.getActiveAdminAlbum()?.id, true); AdminModule.toggleMoreFeaturesDropdown(false);"
                                class="w-full text-left px-3 py-2 rounded-xl hover:bg-rose-50 flex items-center gap-2.5 text-rose-700 font-medium">
                                <i class="fa-solid fa-heart text-rose-600 w-4"></i>
                                <span>2. Trang chọn ảnh của khách</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Row 4: Sub-tabs (Tất cả / Địa điểm / Thư mục) & Sort Order -->
            <div class="flex flex-wrap items-center justify-between gap-3 pt-2 border-t border-zinc-100">
                <div id="managePageSubTabs"
                    class="flex items-center gap-5 overflow-x-auto no-scrollbar text-xs sm:text-sm">
                    <!-- Rendered dynamically by AdminModule -->
                </div>

                <div class="flex items-center gap-1.5 text-xs text-zinc-500 pb-1">
                    <span class="text-zinc-400">↓↑</span>
                    <span>Sắp xếp:</span>
                    <select id="managePageSortSelect" onchange="AdminModule.setManageSortOrder(this.value)"
                        class="bg-transparent font-semibold text-zinc-800 outline-none cursor-pointer">
                        <option value="name_asc">Tên hình ảnh từ A -&gt; Z</option>
                        <option value="name_desc">Tên hình ảnh từ Z -&gt; A</option>
                        <option value="time_asc">Thời gian chụp: Cũ -&gt; Mới</option>
                        <option value="time_desc">Thời gian chụp: Mới -&gt; Cũ</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- 3. FULL-WIDTH PHOTO GRID (4 COLUMNS MASONRY / GALLERY LIKE SCREENSHOT) -->
        <div id="managePagePhotosGrid"
            class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3.5">
            <!-- Rendered dynamically by AdminModule -->
        </div>
    </div>
</main>
